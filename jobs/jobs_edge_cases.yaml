# jobs/jobs_edge_cases.yaml
# Edge cases for testing the system: jobs that cannot be placed (infeasible), jobs that plan
# but miss their deadline, extreme sizes, accelerator-only formats, and custom run timers.
# Each description says what to expect. The infeasible ones are the point: use them to check
# error handling, the infeasible rows in Recent Plans, and batches with mixed outcomes.

version: 0.1.0
jobs:
- id: edge-cpu-too-big
  description: 'INFEASIBLE: one stage asks for more CPU cores than any node has (max is 128).'
  deadline_ms: 10000
  stages:
  - id: s1_ingest
    type: io
    size_mb: 50
    resources:
      cpu_cores: 1
      mem_gb: 1
    allowed_formats:
    - native
    - wasm
  - id: s2_monster
    type: analytics
    size_mb: 100
    resources:
      cpu_cores: 512
      mem_gb: 8
    allowed_formats:
    - native
    - wasm
- id: edge-mem-too-big
  description: 'INFEASIBLE: asks for 4 TB of memory (largest node has 1 TB).'
  deadline_ms: 10000
  stages:
  - id: s1_load
    type: analytics
    size_mb: 500
    resources:
      cpu_cores: 4
      mem_gb: 4096
    allowed_formats:
    - native
    - wasm
- id: edge-vram-too-big
  description: 'INFEASIBLE: asks for 1 TB of GPU memory (largest node has 192 GB).'
  deadline_ms: 10000
  stages:
  - id: s1_prep
    type: preproc
    size_mb: 50
    resources:
      cpu_cores: 2
      mem_gb: 2
    allowed_formats:
    - native
    - wasm
  - id: s2_giant_model
    type: mlp
    size_mb: 200
    resources:
      cpu_cores: 8
      mem_gb: 16
      gpu_vram_gb: 1024
    allowed_formats:
    - cuda
    - native
- id: edge-conflicting-formats
  description: 'Allows only asic yet also lists it as disallowed. The planner ignores disallowed_formats, so it
    still lands on the single asic node: documents that gap.'
  deadline_ms: 10000
  stages:
  - id: s1_exotic
    type: cv
    size_mb: 50
    resources:
      cpu_cores: 1
      mem_gb: 1
    allowed_formats:
    - asic
    disallowed_formats:
    - asic
- id: edge-cuda-no-gpu-fallback
  description: Needs cuda only with 80 GB VRAM, so only a few big GPU hosts qualify.
  deadline_ms: 12000
  stages:
  - id: s1_train
    type: mlp
    size_mb: 300
    resources:
      cpu_cores: 8
      mem_gb: 32
      gpu_vram_gb: 80
    allowed_formats:
    - cuda
- id: edge-asic-only
