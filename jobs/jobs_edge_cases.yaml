- id: edge-impossible-deadline
  description: Feasible placement but a 1 ms deadline, so it plans and then misses the SLA.
  deadline_ms: 1
  stages:
  - id: s1_a
    type: preproc
    size_mb: 100
    resources:
      cpu_cores: 2
      mem_gb: 2
