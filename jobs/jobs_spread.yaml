# jobs/jobs_spread.yaml
# Eight wide jobs (10-24 stages each) with heavy per-stage CPU/memory, so the planner
# has to spread them over many nodes and federations instead of stacking one host.
# Pair with the existing jobs_10.yaml; try them with greedy, resilient and rl_markov.

